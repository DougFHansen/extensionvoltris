name: CI

# Every gate here exists because a real defect got past a weaker version of it.
# The unit tests miss browser-only behaviour, the audits run over the BUILT
# package rather than the source, and the archive check exists because a
# packaging defect was invisible to every other test.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Typecheck, tests, audits, package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Secret scan
        # Runs before anything else. A credential in the history is permanent.
        run: node scripts/scan-secrets.mjs

      - name: Dependency audit
        run: npm audit --audit-level=high

      - name: Build, audit the built package, package
        run: npm run verify

      - name: Confirm no development-only API shipped
        # npm run verify already runs this; it is called out because the fault
        # it prevents (statistics driven by an unpacked-only API) is silent.
        run: node scripts/static-analysis.mjs

      - name: Upload store archives
        uses: actions/upload-artifact@v4
        with:
          name: store-packages
          path: artifacts/*.zip
          if-no-files-found: error
          retention-days: 30

  browser:
    name: End-to-end in a real browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci

      # `verify:package` needs the archive, so packaging must happen BEFORE it.
      # The first CI run failed here because only `npm run build` ran.
      - name: Build and package
        run: |
          npm run build
          npm run package

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: End-to-end suite
        run: npm run test:e2e

      - name: Load the packaged archive
        # Proves the artifact that would be uploaded to the stores actually runs,
        # extracted by a reader we did not write.
        run: node scripts/verify-package.mjs

  live-feeds:
    name: Real threat feeds end to end
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm run build
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Download the real feeds and verify the rule set
        # This job is the one that would have caught the shipping fault: the
        # pipeline silently produced no dataset, so the extension ran with zero
        # protection while every offline test passed. It needs the network.
        run: npm run test:e2e:live
